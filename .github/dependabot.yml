# GitHub Actions の部品（actions/checkout など）に新バージョンが出たら更新 PR を作る
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
