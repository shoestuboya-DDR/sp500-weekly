name: update

on:
  schedule:
    # 毎日 09:17 JST。毎時ちょうどは GitHub 側が混雑して遅延・スキップされやすいので外す
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/app.js"
      - "site/style.css"
      - "src/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/update.yml"

# 既定は読み取りのみ。必要な権限はジョブごとに付ける
permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Secrets を扱うジョブ。data.json / notified.json のコミットに必要な書き込み権限だけ持つ
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        id: test
        run: python -m unittest discover -s tests -t . -v

      - name: Update data and notify
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/update.py

      # 失敗時もエラー通知の送信時刻（state）を残すため、テスト成功後は常にコミットする
      - name: Commit data
        if: ${{ !cancelled() && steps.test.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in site/data/data.json state/notified.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: update $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 実行中に別のコミットが push されていても通知履歴を確実に残すため、
          # 最新を取り込んでから push し、失敗したら数回やり直す
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push に失敗（${i}回目）。リトライする"
            sleep $((i * 5))
          done
          echo "::error::data.json / notified.json の push に失敗。翌日に同じ通知が再送される可能性あり"
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    # Pages への公開だけを行うジョブ。Secrets は渡さない
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
